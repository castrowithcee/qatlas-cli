# Example qatlas configuration.
#
# Copy this file to ~/.qatlas/cli/config.yaml and replace the placeholders. It contains no real
# endpoints and no secrets: a credential only says where its secrets come from, never what they are.
#
# Check your edits with:       qatlas config validate
# See where secrets come from: qatlas config validate --secrets

version: 3

# A service is one technical API endpoint of one provider.
services:
  wiki-primary:
    provider: bookstack
    base_url: https://wiki.example.invalid

  # A second instance of the same provider needs no duplication beyond its own endpoint.
  wiki-archive:
    provider: bookstack
    base_url: https://archive.example.invalid

  # Telegram uses the Bot API root. The TUI fills this default when Telegram is selected.
  telegram-main:
    provider: telegram
    base_url: https://api.telegram.org

  # Lexware accepts only its fixed production gateway, because an API key is bound to that one origin.
  books:
    provider: lexware
    base_url: https://api.lexware.io

  # Twenty CRM is either the managed cloud or a self-hosted workspace. Both are bare https origins: the
  # requests of a connection never leave the origin its service names.
  crm-cloud:
    provider: twenty-crm
    base_url: https://api.twenty.com

  crm-selfhosted:
    provider: twenty-crm
    base_url: https://crm.example.invalid

  # SeaTable is one instance per service: the managed cloud, a dedicated instance, or a self-hosted
  # server. Every request of a connection stays on the origin its service names.
  tables-cloud:
    provider: seatable.base
    base_url: https://cloud.seatable.io

  tables-onprem:
    provider: seatable.base
    base_url: https://seatable.example.invalid

  # Nextcloud is one instance per service. The URL may carry an installation path when the instance does
  # not sit at the root of its host; every request of a connection stays inside it.
  cloud-main:
    provider: nextcloud
    base_url: https://cloud.example.invalid

  cloud-partner:
    provider: nextcloud
    base_url: https://partner.example.invalid/nextcloud

  # GitHub is https://api.github.com, or https://HOST/api/v3 for GitHub Enterprise Server. Qatlas derives
  # the GraphQL endpoint from it; every request of a connection stays on this service.
  github:
    provider: github
    base_url: https://api.github.com

  # Todoist accepts only the official API v1 root, because a personal token belongs to that one service.
  todoist:
    provider: todoist
    base_url: https://api.todoist.com/api/v1

# A credential says where secrets come from. BookStack needs the roles token-id and token-secret.
# A credential names the source of the secrets one provider needs, never a secret itself.
#
# provider is optional and names the system these secrets belong to. Secret roles are provider-defined, so
# it is what tells a token-id/token-secret pair apart from a bot-token: `qatlas tui` then asks for
# exactly those roles instead of every role every compiled provider knows. A credential without it stays
# valid and keeps offering all of them.
credentials:
  # type: keyring is the recommended type on a workstation. It keeps the secrets in the system keyring,
  # the credential store the operating system already provides: Secret Service on Linux (for example
  # GNOME Keyring or KWallet), the macOS Keychain, or the Windows Credential Manager. Nothing has to be
  # set up or exported, and nothing lands in this file. Fill it in `qatlas tui` (s on the role) or with:
  #
  #     printf %s "$TOKEN_ID" | qatlas credential set wiki-reader token-id
  #     printf %s "$TOKEN_SECRET" | qatlas credential set wiki-reader token-secret
  #
  # QATLAS_WIKI_READER_TOKEN_ID and QATLAS_WIKI_READER_TOKEN_SECRET still override the keyring when
  # they are set; the derived name is always QATLAS_<CREDENTIAL>_<ROLE>. Without a usable keyring, use
  # type: vault below instead; QATLAS_CREDENTIAL_STORE=none switches the keyring off for a run, for
  # example in CI.
  wiki-reader:
    provider: bookstack
    type: keyring

  # type: vault keeps the secrets in the vault instead: a directory named vault beside this file,
  # unencrypted or encrypted to a passphrase, for a machine without a usable system keyring. Fill it the
  # same way, with `qatlas credential set`; storing the vault's very first secret offers a passphrase on
  # the terminal, and leaving it empty keeps the vault unencrypted. `qatlas vault status` shows whether it
  # exists, is encrypted, and is unlocked; `qatlas vault unlock` opens it in a vault process for every later
  # CLI and MCP call on Linux and macOS, elsewhere only for the current process. `credential
  # set`, `credential delete`, and `vault encrypt`/`passphrase`/`decrypt`/`migrate` manage a credential or the
  # vault and run only from an interactive terminal; where the vault is encrypted they also ask for its
  # passphrase there, once per command. QATLAS_WIKI_STANDBY_TOKEN_ID and QATLAS_WIKI_STANDBY_TOKEN_SECRET
  # still override it.
  wiki-standby:
    provider: bookstack
    type: vault

  # type: env names the variables instead, which is the way for CI and for headless machines. Such a
  # credential is resolved from those variables alone: no store and no file stands in for one that is
  # unset, so a missing secret stays a visible failure.
  wiki-auditor:
    provider: bookstack
    type: env
    values:
      token-id: QATLAS_WIKI_AUDITOR_TOKEN_ID
      token-secret: QATLAS_WIKI_AUDITOR_TOKEN_SECRET

  telegram-notifier:
    provider: telegram
    type: env
    values:
      bot-token: QATLAS_TELEGRAM_NOTIFIER_BOT_TOKEN

  # Lexware needs the single role api-key. Give the key only the API access this connection requires.
  books-accountant:
    provider: lexware
    type: keyring

  # Twenty needs the single role api-key too. Assign each key a workspace role limited to the intended
  # company operations, and keep one key per workspace so the two never mix.
  crm-cloud-reader:
    provider: twenty-crm
    type: keyring

  crm-selfhosted-reader:
    provider: twenty-crm
    type: keyring

  # SeaTable needs the single role api-token. An API token belongs to exactly one base and carries its
  # own permission, so use r for a reader and rw only when writes are intended. Qatlas exchanges it for
  # a short-lived base token on every run and never stores that token.
  #
  # These two tokens address the same base with different permissions, which is why they are two
  # credentials rather than one.
  sales-base-reader:
    provider: seatable.base
    type: keyring

  sales-base-auditor:
    provider: seatable.base
    type: keyring

  # A second base of the same instance needs its own token, because a token never leaves its base.
  support-base-reader:
    provider: seatable.base
    type: keyring

  onprem-base-reader:
    provider: seatable.base
    type: keyring

  # Nextcloud needs the two roles user-id and app-password, because both belong to one identity. Create
  # the app password under Settings, Security, Devices and sessions; it is revocable on its own and never
  # exposes the account password or defeats a second factor.
  #
  # These two credentials are two identities of the same instance, so a connection always says which one
  # it reads as.
  cloud-reader:
    provider: nextcloud
    type: keyring

  cloud-auditor:
    provider: nextcloud
    type: env
    values:
      user-id: QATLAS_CLOUD_AUDITOR_USER_ID
      app-password: QATLAS_CLOUD_AUDITOR_APP_PASSWORD

  partner-reader:
    provider: nextcloud
    type: keyring

  # GitHub needs the single role token. A reader gets a read-only token: classic with read:project plus
  # repo (or public_repo), or fine-grained with read access to issues and projects.
  github-reader:
    provider: github
    type: keyring

  # A planner changes issues and project items: classic with project plus repo, or fine-grained with write
  # access to issues and projects.
  github-planner:
    provider: github
    type: keyring

  # An Actions operator dispatches, re-runs, and cancels workflow runs: classic with repo, or fine-grained with
  # Actions read and write plus Contents read. An observer only needs Actions read, which a reader can hold.
  github-operator:
    provider: github
    type: keyring

  # Workflow maintenance and Actions administration are high risk: give them a credential of their own,
  # ideally a fine-grained token limited to the one repository. Changing workflow files needs repo and
  # workflow on a classic token, or Contents and Workflows read and write on a fine-grained one; enabling or
  # disabling workflows needs Actions read and write; the Actions settings need Administration read and write
  # (a classic token of a repository administrator with repo). Grant only what the connection lists.
  github-maintainer:
    provider: github
    type: keyring

  # Todoist needs the single role token, the personal API token from Settings, Integrations, Developer. It
  # reaches the whole account, so each connection's targets decide which projects Qatlas exposes.
  todoist-reader:
    provider: todoist
    type: keyring

  # A forward credential is a payload secret a tool passes on to a third party by reference, never a secret of
  # a provider. It lists the names of its fields, uses type vault or keyring, and a connection releases it
  # with forward_secrets below. Store its fields with `qatlas credential set shared-login username`. With an
  # encrypted vault, listing it in forward_secrets and changing its fields need a new approval.
  shared-login:
    forward: true
    type: vault
    fields: [username, password]
    description: the shared login of the partner portal

# A connection is what you select with --connection. It binds one service to one credential.
#
# description is optional and yours to maintain: one line of at most 200 characters saying what the route
# is for. A name is a stable selector, not an explanation, so this is what tells two routes of the same
# provider apart. It is published by 'qatlas describe <tool-id>' and by qatlas.describe, and it names the
# candidates of a connection-ambiguous diagnostic. It is never sent to a provider, and it never selects a
# route on its own. Because it is published, never write a secret or personal data into it.
#
# A connection offers tools in one of two ways, never both; giving effects and tools together makes the
# file invalid.
#
# effects offers by effect: every tool of these effects, including tools a later version adds. Supported
# effects are read, create, update, delete, and execute. Qatlas' local selection can only restrict a
# provider credential, never expand it. When omitted, the provider's compatibility default applies, which
# preserves only operations that existed before connection effects were added. An explicit YAML list
# `effects: []` offers no tool; the TUI spells this value `none` and uses an empty field for the default.
# High-risk tools marked as listed only are never offered by effect.
#
# tools offers selected tools: complete tool IDs of this connection's provider, as listed by
# 'qatlas tools <provider> --all'. A connection offers exactly the listed tools, and a tool added later
# joins only when you add it; the effects it covers follow from the tools and are not written. It never
# widens what the provider credential or the target allows. `tools: []` offers no tool at all. Every entry
# must be a registered tool of the connection's provider, listed once; anything else makes the file
# invalid. Each connection keeps its own selection, even when it shares the provider, the service, or the
# credential with another one.
#
# paths optionally binds a connection to projects: a list of directories, absolute or starting with ~/, each
# covering itself and everything below it, compared by whole directory names, so ~/repos/kunde-a does not
# cover ~/repos/kunde-ab. Glob patterns are refused. The project of a call is its working directory, or the
# root of the Git repository that directory lies in; symbolic links are resolved, and a linked worktree
# checked out elsewhere also counts as its repository's main working tree. 'qatlas mcp' uses the directory
# it was started in. Outside its paths a connection is missing from connections, providers, tools,
# describe, search and every candidate list, a default that names it does not apply, and naming it fails
# with unknown-connection. Without paths it applies everywhere. 'qatlas config validate' and 'qatlas tui'
# still show every connection, and validate warns about an entry that names no existing directory. The
# binding keeps the connections of one customer out of another customer's project by mistake, not by
# force: an agent that changes into a bound directory sees that connection there. While the vault is
# encrypted, a change of paths needs a new approval.
#
# The TUI starts a new connection on its provider's recommended setup profile, for example read, which
# selects the concrete tools it names; every tick can be changed before saving. A profile is
# a visible starting selection, not a role: this file stores only effects or tools, never a profile,
# and a saved connection never follows one. The credential still decides what the provider allows.
connections:
  wiki:
    service: wiki-primary
    credential: wiki-reader
    description: the live team wiki, everyone reads this one
    effects: [read, create, update, delete]

  # A connection releases a forward credential to its tools with forward_secrets: a tool argument marked as a
  # secret reference may then name shared-login, and the tool sends its fields on without anyone typing
  # them. Nothing else is released. With an encrypted vault the release goes only through a connection that
  # reads a vault credential itself, as this one does, and a change of the list needs a new approval.
  wiki-standby:
    service: wiki-primary
    credential: wiki-standby
    description: the standby wiki account, may pass the partner portal login to tools
    effects: [read, create]
    forward_secrets: [shared-login]

  # The same service with a different key, for example a more restricted account. Its tools list offers
  # reading single pages and listing them, but no other read tool the provider adds later.
  wiki-audit:
    service: wiki-primary
    credential: wiki-auditor
    description: the same instance read with the restricted audit account
    tools: [bookstack.pages.get, bookstack.pages.list]

  # A different service reusing the same credential, optionally scoped with target.
  archive:
    service: wiki-archive
    credential: wiki-reader
    target: books
    description: retired wiki content, read-only reference
    effects: [read]

  # Telegram requires a fixed non-secret target on every connection. Two connections can bind the same
  # bot to different chats without mixing their targets.
  telegram-alerts:
    service: telegram-main
    credential: telegram-notifier
    target: "-1001111111111"
    effects: [create, update, delete]
  telegram-operations:
    service: telegram-main
    credential: telegram-notifier
    target: "-1002222222222"
    effects: [create]

  # Lexware needs no target: the organization follows from the API key. This connection is bound to the
  # projects under one customer's directory and exists nowhere else.
  accounting:
    service: books
    credential: books-accountant
    effects: [read, create]
    paths: ["~/repos/kunde-a"]

  # Twenty needs no target either: the workspace follows from the API key. Two workspaces stay two
  # connections, so a read always names the one it means.
  crm:
    service: crm-cloud
    credential: crm-cloud-reader
    description: the managed Twenty workspace used by sales
    effects: [read, create, update, delete]

  crm-internal:
    service: crm-selfhosted
    credential: crm-selfhosted-reader
    description: the self-hosted Twenty workspace for internal accounts
    effects: [read]

  # A SeaTable connection binds one instance and one base token to one table, an explicit allow-list, or
  # the explicit * wildcard. The optional view after a slash narrows listing; id:TABLEID and id:VIEWID
  # address tables and views by identifier, which is also the way to reach a name containing a slash.
  sales-rows:
    service: tables-cloud
    credential: sales-base-reader
    target: Kunden
    effects: [read, create, update, delete]

  sales-rows-audit:
    service: tables-cloud
    credential: sales-base-auditor
    target: Kunden/Aktive
    effects: [read]

  support-rows:
    service: tables-cloud
    credential: support-base-reader
    target: id:0001
    effects: [read]

  sales-selected-tables:
    service: tables-cloud
    credential: sales-base-reader
    targets: ["id:0000", "id:0001"]
    effects: [read]

  # This deliberately exposes every table in the base to the agent. Prefer targets when a smaller scope
  # is enough. Row and column operations then require a table reference from seatable.base.tables.list.
  sales-all-tables:
    service: tables-cloud
    credential: sales-base-reader
    target: "*"
    effects: [read]

  onprem-rows:
    service: tables-onprem
    credential: onprem-base-reader
    target: Tickets
    effects: [read]

  # A Nextcloud connection binds one instance, one identity, and one fixed root folder below the Files of
  # that identity. A read may address a path below that folder and nothing above it. A single / would
  # bind the whole Files root of the identity.
  files-reports:
    service: cloud-main
    credential: cloud-reader
    target: Reports
    effects: [read, create, update, delete]

  files-archive:
    service: cloud-main
    credential: cloud-reader
    target: Archive/2026
    effects: [read]

  # The same instance read as a second identity, with its own app password and its own root folder.
  files-audit:
    service: cloud-main
    credential: cloud-auditor
    target: Audit
    effects: [read]

  files-partner:
    service: cloud-partner
    credential: partner-reader
    target: Shared/Qatlas
    effects: [read]

  # A GitHub connection may list targets, an optional allow-list of repositories (repos/OWNER/REPO),
  # projects (users/LOGIN/projects/NUMBER or orgs/LOGIN/projects/NUMBER), and patterns with * as the last
  # segment (repos/OWNER/*, orgs/LOGIN/projects/*). Without targets it reaches whatever its token reaches.
  # Every tool takes the repository or project it acts on; the argument may be left out only when the
  # targets allow exactly one of its kind. Which tools a connection offers is decided by effects or
  # tools alone.
  # Work selection starts at the project; the issue connection is the fallback for single issues.
  # Reads are the only default: a change needs create or update in effects and confirmation per call.
  planning:
    service: github
    credential: github-reader
    target: orgs/octo-org/projects/7
    description: the planning project of the example repository
    tools: [github.project-items.get, github.project-items.list]

  planning-issues:
    service: github
    credential: github-reader
    target: repos/octo-org/example
    tools: [github.issues.get, github.issues.list]

  # A project listed with the repositories it plans in: github.project-items.add and
  # github.project-issues.create check both targets, and with one project and one repository neither
  # argument is needed.
  roadmap:
    service: github
    credential: github-planner
    targets: [orgs/octo-org/projects/7, repos/octo-org/example]
    description: maintains the planning project and creates its issues
    tools: [github.project-items.list, github.project-items.get, github.project-items.update,
      github.project-items.add, github.project-issues.create]

  # Changes of single issues and their comments. repos/octo-org/* would allow every repository of the owner;
  # a call then names its repository.
  roadmap-issues:
    service: github
    credential: github-planner
    target: repos/octo-org/example
    tools: [github.issues.get, github.issues.update, github.issues.close, github.issues.reopen,
      github.comments.list, github.comments.create]

  # GitHub Actions tools come in two groups. An observer reads workflows, runs, jobs,
  # artifact metadata, and the end of job logs; without execute it can neither see nor start an operator tool.
  ci-observer:
    service: github
    credential: github-reader
    target: repos/octo-org/example
    description: diagnoses the workflow runs of the example repository
    tools: [github.workflows.list, github.workflows.get, github.workflow-runs.list, github.workflow-runs.get,
      github.workflow-jobs.list, github.workflow-jobs.get, github.workflow-jobs.log, github.workflow-artifacts.list]

  # An operator also dispatches workflows and re-runs or cancels runs. It needs execute, which no planning
  # effect implies, and every execution needs confirmation in its own invoke request.
  ci-operator:
    service: github
    credential: github-operator
    target: repos/octo-org/example
    description: re-runs and dispatches the workflows of the example repository
    tools: [github.workflow-runs.list, github.workflow-runs.get, github.workflow-jobs.list, github.workflow-jobs.log,
      github.workflows.dispatch, github.workflow-runs.rerun, github.workflow-runs.rerun-failed,
      github.workflow-runs.cancel]

  # A workflow maintainer reads, creates, and updates files directly below .github/workflows/ and enables or
  # disables workflows. These tools are listed only: no connection offers them unless its tools list names
  # them, so neither a planner with create and update nor an operator with execute gains them. An update
  # names the blob SHA it replaces, and every change needs confirmation in its own invoke request.
  ci-maintainer:
    service: github
    credential: github-maintainer
    target: repos/octo-org/example
    description: maintains the workflow files of the example repository
    tools: [github.workflows.list, github.workflows.get, github.workflow-files.list, github.workflow-files.get,
      github.workflow-files.create, github.workflow-files.update, github.workflows.enable, github.workflows.disable]

  # An Actions administrator reads and changes whether Actions run, which actions they may use, and the
  # default rights of the GITHUB_TOKEN, and the merge and branch settings. Its tools are listed only as well.
  ci-admin:
    service: github
    credential: github-maintainer
    target: repos/octo-org/example
    description: administers the Actions settings of the example repository
    tools: [github.actions-permissions.get, github.actions-permissions.update, github.workflow-permissions.get,
      github.workflow-permissions.update, github.repository-settings.get, github.repository-settings.update]

  # A Todoist connection binds one personal account to an explicit list of project IDs. Tasks, sections,
  # comments, and reminders of any other project are never returned, and no argument widens the list.
  # This connection only reads.
  todoist-work:
    service: todoist
    credential: todoist-reader
    targets: ["6XGgm6PHrGgMpCFX", "6Jf8VQXxpwv56VQ7"]
    description: the work projects of the personal Todoist account
    tools: [todoist.projects.list, todoist.projects.get, todoist.sections.list, todoist.tasks.list,
      todoist.tasks.filter, todoist.tasks.get, todoist.completed-tasks.list, todoist.comments.list,
      todoist.reminders.list]

  # This connection also creates, updates, moves, closes, and reopens tasks and writes comments and
  # reminders in one project. Nothing outside the project is changed, every change needs its own
  # confirmation, and the delete tools stay out of its tools list. It reuses the reading credential: a
  # Todoist personal token always reaches the whole account, so the target and the tools list are what
  # limit this route.
  todoist-tasks:
    service: todoist
    credential: todoist-reader
    target: "6XGgm6PHrGgMpCFX"
    description: manages the tasks of one personal Todoist project
    tools: [todoist.projects.get, todoist.sections.list, todoist.tasks.list, todoist.tasks.get,
      todoist.comments.list, todoist.reminders.list, todoist.tasks.create, todoist.tasks.update,
      todoist.tasks.move, todoist.tasks.close, todoist.tasks.reopen, todoist.comments.create,
      todoist.comments.update, todoist.reminders.create, todoist.reminders.update]

  # This connection organizes the whole account: it creates and changes personal projects, sections, and
  # labels, which only a * connection may do for projects and labels. Archiving and the deletes are left
  # out; a project, section, or label delete is offered only when the tools list names it.
  todoist-organize:
    service: todoist
    credential: todoist-reader
    target: "*"
    description: organizes the projects, sections, and labels of the personal Todoist account
    tools: [todoist.projects.list, todoist.projects.get, todoist.sections.list, todoist.labels.list,
      todoist.projects.create, todoist.projects.update, todoist.sections.create, todoist.sections.update,
      todoist.sections.reorder, todoist.sections.move, todoist.labels.create, todoist.labels.update,
      todoist.labels.reorder]

  # This deliberately exposes the whole Todoist account, including saved filters. Prefer project IDs when a
  # smaller scope is enough; only such an account connection offers todoist.filters.list.
  todoist-account:
    service: todoist
    credential: todoist-reader
    target: "*"
    effects: [read]

# A provider note says in one optional line what a provider stands for here, in the words a task uses for
# it. The provider's own description already says what kind of system it is, and a connection description
# what one route is for. Discovery publishes and searches notes, so `qatlas tools --query wiki` finds the
# BookStack tools; like a description, a note never holds a secret or personal data.
provider_notes:
  bookstack: team wiki
  twenty-crm: CRM of the sales team

# A call without a connection uses the default of its tool ID, then the default of its provider, then the
# one connection of the current project that offers the tool. The key under connections is a tool
# namespace such as bookstack, or a complete tool ID such as bookstack.pages.list when one tool needs its
# own route. A default that names a connection the tool does not offer is refused, and several connections
# without a default make the call ask for a connection.
#
# secret_store names the credential type `qatlas tui` and `qatlas credential set` start a new credential
# from: keyring, this default, or vault, for a machine without a usable system keyring. Leaving it out
# means keyring; it is shown here only to name the field, and a person still picks the type themselves.
defaults:
  connections:
    bookstack: wiki
  secret_store: keyring

# The vault process that `qatlas vault unlock` starts on Linux and macOS holds an encrypted vault unlocked
# until it goes this long without a read, as a Go duration such as 12h or 30m. Leaving it out means 12h; it
# must be positive, and `qatlas vault lock` locks the vault at once instead.
vault:
  idle_timeout: 12h
