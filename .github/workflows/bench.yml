name: Storage benchmarks

# Manual only: the runs are measurements, not checks, and are not part of the required CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: bench (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmarks
        run: |
          go test ./internal/config ./internal/invokelog -run '^$' \
            -bench 'BenchmarkReadUnderWrite|BenchmarkUpdateLockWait|BenchmarkAppendManyDays' \
            -benchtime 3x -count 3 -timeout 40m | tee bench.txt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-benchmarks-macos
          path: bench.txt
          if-no-files-found: error
