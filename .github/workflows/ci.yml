name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Golden files are compared byte for byte, so Windows must not check them out with CRLF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      # A short DNS or network outage on the runner must not fail the job before any test runs.
      - name: Download modules
        run: |
          for delay in 10 30 0; do
            go mod download && exit 0
            status=$?
            [ "$delay" -eq 0 ] && exit "$status"
            echo "go mod download failed with exit $status, retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
